version: '3.8'

services:
  # 1. Frontend Web Portal (Vite React + Nginx on Port 6002)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: match_emails_frontend
    restart: always
    ports:
      - "6002:6002"
    depends_on:
      - backend
    networks:
      - match_net

  # 2. Backend Express API & Matching Engine on Port 6003
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: match_emails_backend
    restart: always
    ports:
      - "6003:6003"
    environment:
      - PORT=6003
      - NODE_ENV=production
      - DB_HOST=192.168.1.190
      - DB_USER=root
      - DB_PASSWORD=Minmoy@1234@
      - DB_NAME=defaultdb
      - DB_PORT=3306
      - DB_TABLE=threads
      - SYNC_INTERVAL_MS=14400000
    volumes:
      - ./Backend/data:/app/data
      - ./Backend/cache:/app/cache
      - ./Backend/credentials.json:/app/credentials.json
      - ./Backend/token.json:/app/token.json
    networks:
      - match_net

  # 3. Gmail OCR & Email Processing Pipeline Agent
  emails-agent:
    build:
      context: ./Emails_agent
      dockerfile: Dockerfile
    container_name: match_emails_agent
    restart: always
    volumes:
      - ./Emails_agent:/app
    networks:
      - match_net

networks:
  match_net:
    driver: bridge
