version: '3.8'

services:
  # 1. Frontend Web Portal (Vite React + Nginx on Port 6002)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: match_emails_frontend
    restart: always
    ports:
      - "6002:6002"
    depends_on:
      - backend
    networks:
      - match_net

  # 2. Backend Express API & Matching Engine on Port 6003
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: match_emails_backend
    restart: always
    ports:
      - "6003:6003"
    environment:
      - PORT=6003
      - NODE_ENV=production
      - DB_HOST=192.168.1.190
      - DB_USER=root
      - DB_PASSWORD=Minmoy@1234@
      - DB_NAME=defaultdb
      - DB_PORT=3306
      - DB_TABLE=threads
      - GOOGLE_SPREADSHEET_ID=1GTwzxMgViohbCimXqfiBZBJsKbCSr7hCgbcHF_En1VE
      - GOOGLE_SHEET_GID=1274623128
      - SYNC_INTERVAL_MS=14400000
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./Backend/data:/app/data
      - ./Backend/cache:/app/cache
      - ./:/app/root_config:ro
      - ./token.json:/app/root_config/token.json:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - match_net

  # 3. Gmail OCR & Email Processing Pipeline Agent
  emails-agent:
    build:
      context: ./Emails_agent
      dockerfile: Dockerfile
    container_name: match_emails_agent
    restart: always
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./Emails_agent:/app
      - ./:/app/root_config:ro
      - ./token.json:/app/root_config/token.json:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - match_net

networks:
  match_net:
    driver: bridge
